version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: "monthly"
  groups:
    minor-and-patch:
      update-types:
        - "minor"
        - "patch"

- package-ecosystem: npm
  directory: "/docs"
  schedule:
    interval: "monthly"
  groups:
    minor-and-patch:
      update-types:
        - "minor"
        - "patch"

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: "monthly"
  groups:
    minor-and-patch:
      update-types:
        - "minor"
        - "patch"