name: PHPUnit Tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run PHPStan
        run: php vendor/bin/phpstan analyze

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.4', '8.5', '8.6']
        laravel: ['12.*', '13.*']
        stability: ['prefer-stable']

    name: PHP ${{ matrix.php-version }} - Laravel ${{ matrix.laravel }} (${{ matrix.stability }})

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        coverage: xdebug

    - name: Install Laravel Framework Version
      run: |
        composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run Tests
      run: php vendor/bin/phpunit --coverage-clover .build/clover.xml

    - name: Record Coverage
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: php vendor/bin/php-coveralls